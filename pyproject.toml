[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-reel-ng"
version = "0.1.0"
description = "auto-reel-ng engine: a binary-agnostic ffmpeg runtime and a fail-loud media-probe layer"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["video", "ffmpeg", "ffprobe", "metadata"]
authors = [
    { name = "Emil", email = "emil@jacero.se" }
]
dependencies = [
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=25.9.0",
    "isort>=5.13.2",
    "mypy>=1.18.0",
    "pylint>=3.3.8",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/emil-jacero/auto-reel-ng"
Repository = "https://github.com/emil-jacero/auto-reel-ng.git"
Issues = "https://github.com/emil-jacero/auto-reel-ng/issues"

[tool.hatch.build.targets.wheel]
packages = ["auto_reel_ng"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=auto_reel_ng"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["auto_reel_ng"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "C0301",  # line-too-long (handled by black)
    "R0801",  # duplicate-code (re-exported __all__ lists overlap by design)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "fp", "id"]

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-bool-expr = 5
max-branches = 15
max-locals = 25
max-parents = 7
max-public-methods = 20
max-returns = 8
max-statements = 60
min-public-methods = 1
