[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-reel-ng"
version = "0.1.0"
description = "auto-reel-ng engine: a binary-agnostic ffmpeg runtime and a fail-loud media-probe layer"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["video", "ffmpeg", "ffprobe", "metadata"]
authors = [
    { name = "Emil", email = "emil@jacero.se" }
]
dependencies = [
    "ruamel.yaml>=0.18.0",
    "pycairo>=1.26.0",
    "PyGObject>=3.50.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.139.0",
    # Already FastAPI's own dependency; declared because api/ imports it directly and the
    # media routes' 416 needs >= 1.0 (`Content-Range: bytes */<size>`; 0.x omits the unit).
    "starlette>=1.0",
    "uvicorn>=0.51.0",
    # uvicorn ships no WebSocket implementation on its own (`uvicorn[standard]`
    # pulls in far more than needed here) — required for WS /api/v1/ws/jobs.
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=25.9.0",
    "isort>=5.13.2",
    "mypy>=1.18.0",
    "pylint>=3.3.8",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
auto-reel = "auto_reel_ng.cli.main:main"

[project.urls]
Homepage = "https://github.com/emil-jacero/auto-reel-ng"
Repository = "https://github.com/emil-jacero/auto-reel-ng.git"
Issues = "https://github.com/emil-jacero/auto-reel-ng/issues"

[tool.hatch.build.targets.wheel]
packages = ["auto_reel_ng"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=auto_reel_ng"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "gpu: integration test that requires a real, usable hardware accelerator",
    "has_fonts: image/render test that requires Cairo/Pango and the bundled default font",
    "has_ffmpeg: integration test that requires a real, usable ffmpeg >= 7.1",
    "requires_db: integration test that requires a podman-launched Postgres container",
]

[tool.coverage.run]
source = ["auto_reel_ng"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# PyGObject (``gi``) and pycairo ship no usable type stubs; exempt them from the
# missing-imports check the way the upstream project exempts moviepy/exifread. The
# untyped surface is confined behind ``render_title_card`` (see render/title).
[[tool.mypy.overrides]]
module = ["gi.*", "cairo.*"]
ignore_missing_imports = true

[tool.pylint.main]
# The local ``alembic/`` migrations tree shares its name with the installed
# ``alembic`` package; pylint's import resolution collides on that, not on any
# lint issue in the migration scripts themselves.
ignore-paths = ["^alembic/.*"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "C0301",  # line-too-long (handled by black)
    "R0801",  # duplicate-code (re-exported __all__ lists overlap by design)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "fp", "id"]

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-bool-expr = 5
max-branches = 15
max-locals = 25
max-parents = 7
max-public-methods = 20
max-returns = 8
max-statements = 60
min-public-methods = 1
