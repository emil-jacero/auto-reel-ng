<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The page background (--bg in src/styles/tokens.css); a meta cannot read a CSS token.
         src/shell/theme.ts holds the same two values for the theme control. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11" />
    <title>auto-reel</title>
    <script>
      /*
       * The stored theme choice, applied before the first paint. Same key as src/shell/theme.ts.
       * Both theme-color metas then carry the chosen scheme's color, read from its own meta.
       */
      try { var theme = localStorage.getItem('auto-reel:theme') } catch (error) {}
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        var color = document.querySelector('meta[name="theme-color"][media*="' + theme + '"]').content
        for (var i = 0; i < metas.length; i++) metas[i].content = color
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
