<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The whole font world of the title-card renderer (decision D-22).

  The engine points FONTCONFIG_FILE at this file before Pango makes its first font map
  (auto_reel_ng/render/title/fonts.py: configure_fontconfig). It lists only this directory
  and includes no system configuration, so no host font can be a fallback and no host rule
  (hinting, antialiasing, an alias) changes the glyphs.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">auto-reel/fontconfig</cachedir>
</fontconfig>
